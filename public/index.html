<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentor Desk | Student success workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#132238;--navy-2:#1d3553;--ink:#17243a;--muted:#66758f;--line:#dce4ef;--bg:#f4f7fb;--card:#fff;--gold:#f2b544;--gold-soft:#fff5da;--teal:#168b82;--teal-soft:#e4f6f3;--red:#bd4d4d;--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "DM Sans",system-ui,sans-serif}h1,h2,h3,h4{font-family:"Space Grotesk",sans-serif;line-height:1.15;margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #f2b544;outline-offset:2px}
.shell{min-height:100vh;display:flex}.sidebar{width:252px;background:var(--navy);color:#fff;padding:26px 18px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;font:700 20px "Space Grotesk";margin:0 10px 38px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--gold);color:var(--navy);font-size:16px}.side-label{color:#8ea0ba;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 12px 10px}.nav{display:grid;gap:5px}.nav button{width:100%;border:0;border-radius:10px;background:transparent;color:#c9d4e4;text-align:left;padding:11px 12px;font-weight:600}.nav button:hover,.nav button[aria-current=true]{background:rgba(255,255,255,.1);color:#fff}.nav button[aria-current=true]{box-shadow:inset 3px 0 var(--gold)}.side-footer{margin-top:auto;color:#8ea0ba;font-size:12px;padding:12px}.workspace{min-width:0;flex:1}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.crumb{color:var(--muted);font-size:13px}.user-menu{display:flex;align-items:center;gap:12px}.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold-soft);color:#8a5a00;font-weight:700}.user-name{font-weight:700}.user-role{display:block;color:var(--muted);font-size:12px}.logout{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:7px 11px;font-weight:600}.content{max-width:1280px;margin:0 auto;padding:34px}.eyebrow{color:var(--teal);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 0 7px}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px}.hero h1{font-size:32px}.hero p:not(.eyebrow){color:var(--muted);margin:8px 0 0}.date-pill{background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:13px;padding:8px 13px}.grid{display:grid;gap:18px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.stat-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--teal-soft);color:var(--teal);font-weight:700}.stat strong{display:block;font:700 30px "Space Grotesk";margin-top:12px}.stat small{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.card-header h2{font-size:19px}.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-size:12px;font-weight:700;padding:4px 9px}.badge.gold{background:var(--gold-soft);color:#896000}.btn{border:0;border-radius:9px;background:var(--navy);color:#fff;padding:10px 15px;font-weight:700}.btn:hover{background:var(--navy-2)}.btn.gold{background:var(--gold);color:#3f2b00}.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.small{padding:7px 11px;font-size:13px}.form-grid{display:grid;gap:15px;grid-template-columns:repeat(2,minmax(0,1fr))}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;background:#fbfcfe;color:var(--ink);padding:10px 11px}.field textarea{min-height:100px;resize:vertical}.field.full{grid-column:1/-1}.actions{display:flex;align-items:center;gap:10px;margin-top:18px}.status{color:var(--teal);font-weight:700}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:-4px 0 20px}.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;font-weight:700}.tabs button[aria-current=true]{color:var(--navy);border-color:var(--gold)}.profile-preview{display:grid;gap:14px}.profile-row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:9px 0}.profile-row:last-child{border:0}.profile-row span:first-child{color:var(--muted)}.notes{display:grid;gap:12px}.note{border-left:3px solid var(--gold);background:#fffaf0;border-radius:0 10px 10px 0;padding:12px 14px}.note.recommendation{border-color:var(--teal);background:#f0fbf9}.note-meta{color:var(--muted);font-size:12px;margin-bottom:4px}.empty{border:1px dashed var(--line);border-radius:10px;color:var(--muted);padding:22px;text-align:center}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{text-align:left;border-bottom:1px solid var(--line);padding:11px 8px;white-space:nowrap}.data-table th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.data-table tr:last-child td{border-bottom:0}.student-list{display:grid;gap:2px}.student-list button{border:0;background:transparent;border-radius:9px;color:var(--ink);padding:12px;text-align:left}.student-list button:hover,.student-list button[aria-current=true]{background:#f0f4f9}.student-list small{display:block;color:var(--muted)}.marks{display:grid;gap:8px}.mark-row{display:grid;grid-template-columns:1fr 100px 100px 34px;gap:8px}.remove{border:0;background:transparent;color:var(--muted);font-size:20px}.auth-page{min-height:100vh;display:grid;grid-template-columns:1fr 440px;background:var(--navy)}.auth-intro{display:flex;flex-direction:column;justify-content:center;padding:8vw;color:#fff;background:radial-gradient(circle at 75% 30%,rgba(242,181,68,.2),transparent 28rem)}.auth-intro h1{font-size:clamp(38px,5vw,70px);max-width:650px}.auth-intro p{color:#bfccdc;font-size:18px;max-width:560px}.auth-points{display:grid;gap:12px;margin-top:30px;color:#dce5f1}.auth-points span{color:var(--gold);margin-right:8px}.auth-card{display:flex;align-items:center;background:var(--bg);padding:38px}.auth-box{width:100%;max-width:360px;margin:auto}.auth-box h2{font-size:28px}.auth-box .switch{border:0;background:transparent;color:var(--teal);font-weight:700;padding:0}.error{color:var(--red);font-weight:600;min-height:24px}.mobile-menu{display:none}
@media(max-width:900px){.sidebar{width:210px}.content{padding:26px 20px}.auth-page{grid-template-columns:1fr 380px}}
@media(max-width:720px){.sidebar{display:none;position:fixed;z-index:5;inset:0 auto 0 0}.sidebar.open{display:flex;width:252px;box-shadow:8px 0 30px rgba(0,0,0,.2)}.mobile-menu{display:block;border:0;background:transparent;font-size:22px}.topbar{height:64px;padding:0 18px}.user-name,.user-role{display:none}.content{padding:22px 15px}.hero{display:block}.date-pill{display:inline-block;margin-top:15px}.grid-2,.grid-3,.form-grid{grid-template-columns:1fr}.auth-page{display:block;background:var(--bg)}.auth-intro{min-height:260px;padding:42px 25px}.auth-intro h1{font-size:40px}.auth-intro p,.auth-points{display:none}.auth-card{min-height:calc(100vh - 260px);padding:25px}.mark-row{grid-template-columns:1fr 80px 80px 28px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let token=null,me=null,activeView='dashboard',selectedMentee=null,mentees=[],mentors=[],studentTab='overview';
try{token=localStorage.getItem('md-token')}catch(e){}
const roleLabel=r=>r==='hod'?'Head of Department':r==='mentor'?'Mentor':'Mentee';
const initials=n=>String(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const total=m=>{const a=m.profile?.marks||[],got=a.reduce((s,x)=>s+(+x.got||0),0),max=a.reduce((s,x)=>s+(+x.max||0),0);return max?Math.round(got/max*100):null};
const fmt=d=>{const date=new Date(d);return Number.isNaN(date.getTime())?'':date.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})};
async function api(path,method='GET',body){const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(r.status===401&&token){logout();throw Error('Your session expired. Please sign in again.')}if(!r.ok)throw Error(d.error||'Something went wrong.');return d}
function logout(){token=null;me=null;try{localStorage.removeItem('md-token')}catch(e){}renderAuth('login')}
function renderAuth(mode='login',error=''){const register=mode==='register';$('#root').innerHTML=`<div class="auth-page"><section class="auth-intro"><div class="brand"><span class="brand-mark">M</span> Mentor Desk</div><h1>Better guidance.<br><em>Brighter futures.</em></h1><p>A shared workspace where students, mentors and the HOD stay aligned on progress.</p><div class="auth-points"><div><span>✓</span> One clear student profile</div><div><span>✓</span> Actionable mentor guidance</div><div><span>✓</span> HOD visibility and assignment</div></div></section><section class="auth-card"><form class="auth-box" id="auth-form"><p class="eyebrow">Mentor Desk workspace</p><h2>${register?'Create your account':'Welcome back'}</h2><p class="muted">${register?'Create a mentee account to get started.':'Sign in to continue to your workspace.'}</p>${register?'<div class="field"><label for="auth-name">Full name</label><input id="auth-name" required autocomplete="name"></div>':''}<div class="field" style="margin-top:14px"><label for="auth-email">Email address</label><input id="auth-email" type="email" required autocomplete="email"></div><div class="field" style="margin-top:14px"><label for="auth-password">Password</label><input id="auth-password" type="password" minlength="8" required autocomplete="${register?'new-password':'current-password'}"></div><p class="error" id="auth-error">${esc(error)}</p><button class="btn gold" style="width:100%" type="submit">${register?'Create account':'Sign in'}</button><p class="muted" style="text-align:center;margin-top:18px">${register?'Already have an account?':'New mentee?'} <button class="switch" type="button" id="switch-auth">${register?'Sign in':'Create an account'}</button></p></form></section></div>`;$('#switch-auth').onclick=()=>renderAuth(register?'login':'register');$('#auth-form').onsubmit=async e=>{e.preventDefault();const body={email:$('#auth-email').value,password:$('#auth-password').value};if(register)body.name=$('#auth-name').value;try{const d=await api('/auth/'+(register?'register':'login'),'POST',body);token=d.token;try{localStorage.setItem('md-token',token)}catch(e){}await start()}catch(e){$('#auth-error').textContent=e.message}}}
async function start(){if(!token)return renderAuth();try{me=(await api('/me')).user;activeView='dashboard';await renderApp()}catch(e){renderAuth('login',e.message)}}
function layout(body){const nav=me.role==='mentee'?[['dashboard','Overview'],['profile','My profile'],['updates','Mentor updates']]:[['dashboard','Overview'],['mentees','Mentees'],...(me.role==='hod'?[['manage','Mentors & assignment']]:[])];$('#root').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">M</span> Mentor Desk</div><p class="side-label">Workspace</p><nav class="nav">${nav.map(([id,label])=>`<button data-view="${id}" aria-current="${activeView===id}">${label}</button>`).join('')}</nav><div class="side-footer">A shared space for student success.</div></aside><main class="workspace"><header class="topbar"><button class="mobile-menu" aria-label="Open navigation">☰</button><span class="crumb">Workspace / ${nav.find(x=>x[0]===activeView)?.[1]||'Overview'}</span><div class="user-menu"><div class="avatar">${initials(me.name)}</div><div><span class="user-name">${esc(me.name)}</span><span class="user-role">${roleLabel(me.role)}</span></div><button class="logout" id="logout">Sign out</button></div></header><section class="content">${body}</section></main></div>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{activeView=b.dataset.view;renderApp()});$('#logout').onclick=logout;$('.mobile-menu').onclick=()=>$('.sidebar').classList.toggle('open')}
async function renderApp(){try{if(me.role==='mentee'){const notes=await api('/me/notes');layout(renderMentee(notes))}else{mentees=await api('/mentees');mentors=me.role==='hod'?await api('/mentors'):[];layout(renderStaff())}}catch(e){layout(`<div class="card"><p class="error">${esc(e.message)}</p></div>`)}}
function renderMentee(notes){const p=me.profile||{},avg=total({profile:p});if(activeView==='profile')return studentProfile(p);if(activeView==='updates')return `<div class="hero"><div><p class="eyebrow">Mentor communication</p><h1>Mentor updates</h1><p>Notes and recommendations shared for your growth.</p></div></div><div class="card"><div class="notes">${notes.length?notes.map(noteHtml).join(''):'<div class="empty">Your mentor has not added any updates yet.</div>'}</div></div>`;return `<div class="hero"><div><p class="eyebrow">Student overview</p><h1>Good to see you, ${esc(me.name.split(' ')[0])}.</h1><p>Keep your profile current and make your progress visible.</p></div><span class="date-pill">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}</span></div><div class="grid grid-3"><div class="stat"><div class="stat-top">Profile status <span class="stat-icon">✓</span></div><strong>${me.profile?.dept?'Ready':'Start'}</strong><small>${me.profile?.dept?'Your details are up to date':'Complete your profile'}</small></div><div class="stat"><div class="stat-top">Academic average <span class="stat-icon">%</span></div><strong>${avg===null?'—':avg+'%'}</strong><small>${p.marks?.length||0} subjects recorded</small></div><div class="stat"><div class="stat-top">Mentor updates <span class="stat-icon">↗</span></div><strong>${notes.length}</strong><small>Notes and recommendations</small></div></div><div class="grid grid-2" style="margin-top:18px"><div class="card"><div class="card-header"><div><p class="eyebrow">Your next step</p><h2>${me.profile?.dept?'Review your details':'Complete your profile'}</h2></div><span class="badge">${me.mentor?.name?'Mentor assigned':'Awaiting mentor'}</span></div><p class="muted">${me.mentor?.name?`You are connected with ${esc(me.mentor.name)}. Keep your academic details updated so they can guide you better.`:'Your HOD will assign a mentor once one is available.'}</p><button class="btn gold" onclick="activeView='profile';renderApp()">Open my profile</button></div><div class="card"><div class="card-header"><h2>Latest from your mentor</h2><button class="btn light small" onclick="activeView='updates';renderApp()">View all</button></div><div class="notes">${notes.slice(0,2).map(noteHtml).join('')||'<div class="empty">No updates yet.</div>'}</div></div></div>`}
function studentProfile(p){const notes=[];const f=(id,label,value,type='input')=>`<div class="field"><label for="${id}">${label}</label>${type==='textarea'?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" value="${esc(value)}">`}</div>`;return `<div class="hero"><div><p class="eyebrow">My profile</p><h1>Information hub</h1><p>Manage your personal and academic information in one place.</p></div></div><div class="tabs"><button data-student="overview" aria-current="${studentTab==='overview'}">Summary</button><button data-student="personal" aria-current="${studentTab==='personal'}">Personal details</button><button data-student="academic" aria-current="${studentTab==='academic'}">Academic details</button></div>${studentTab==='overview'?`<div class="grid grid-2"><div class="card"><div class="card-header"><div><p class="eyebrow">Personal</p><h2>${esc(me.name)}</h2></div><button class="btn light small" data-student="personal">Edit</button></div><div class="profile-preview"><div class="profile-row"><span>Contact</span><strong>${esc(p.contact||'Not added')}</strong></div><div class="profile-row"><span>Hobbies</span><strong>${esc(p.hobbies||'Not added')}</strong></div><div class="profile-row"><span>Career goals</span><strong>${esc(p.goals||'Not added')}</strong></div></div></div><div class="card"><div class="card-header"><div><p class="eyebrow">Academic</p><h2>${p.dept?esc(p.dept):'Not completed'}</h2></div><button class="btn light small" data-student="academic">Edit</button></div><div class="profile-preview"><div class="profile-row"><span>Roll number</span><strong>${esc(p.roll||'Not added')}</strong></div><div class="profile-row"><span>Year / semester</span><strong>${esc(p.year||'Not added')}</strong></div><div class="profile-row"><span>Subjects</span><strong>${p.marks?.length||0}</strong></div></div></div></div>`:studentTab==='personal'?`<div class="card"><div class="card-header"><div><p class="eyebrow">Personal details</p><h2>Help your mentor know you</h2></div></div><div class="form-grid">${f('name','Full name',me.name)}${f('contact','Email or phone',p.contact)}${f('hobbies','Hobbies',p.hobbies)}${f('goals','Career goals',p.goals)}${f('about','About you',p.about,'textarea')}</div><div class="actions"><button class="btn gold" id="save-personal">Save personal details</button><span class="status" id="personal-status"></span></div></div>`:`<div class="card"><div class="card-header"><div><p class="eyebrow">Academic details</p><h2>Show your progress</h2></div></div><div class="form-grid">${f('roll','Roll number',p.roll)}${f('dept','Department',p.dept)}${f('year','Year / semester',p.year)}</div><h3 style="margin:25px 0 10px">Marks</h3><div class="marks" id="marks">${(p.marks?.length?p.marks:[{max:100}]).map(markRow).join('')}</div><button class="btn light small" id="add-mark" style="margin-top:10px">+ Add subject</button><div class="actions"><button class="btn gold" id="save-academic">Save academic details</button><span class="status" id="academic-status"></span></div></div>`}<div class="card" style="margin-top:18px"><div class="card-header"><h2>Mentor connection</h2><span class="badge ${me.mentor?.name?'':'gold'}">${me.mentor?.name?'Assigned':'Awaiting assignment'}</span></div><p class="muted">${me.mentor?.name?`Your mentor is ${esc(me.mentor.name)}. You can view their updates from the Mentor updates section.`:'Your HOD will assign a mentor to your account.'}</p></div>`}
function markRow(r){return `<div class="mark-row"><div class="field"><input aria-label="Subject" placeholder="Subject" value="${esc(r.subject)}"></div><div class="field"><input aria-label="Marks obtained" type="number" min="0" placeholder="Got" value="${esc(r.got)}"></div><div class="field"><input aria-label="Maximum marks" type="number" min="1" placeholder="Out of" value="${esc(r.max)}"></div><button class="remove" type="button" aria-label="Remove subject">×</button></div>`}
function noteHtml(n){return `<article class="note ${n.kind==='Recommendation'?'recommendation':''}"><div class="note-meta"><span class="badge ${n.kind==='Recommendation'?'':'gold'}">${esc(n.kind)}</span> ${fmt(n.createdAt)}</div><div>${esc(n.text).replace(/\n/g,'<br>')}</div></article>`}
function renderStaff(){if(activeView==='manage'&&me.role==='hod')return renderManage();return `<div class="hero"><div><p class="eyebrow">${me.role==='hod'?'HOD overview':'Mentor workspace'}</p><h1>${me.role==='hod'?'Student success at a glance':'Your mentees'}</h1><p>${me.role==='hod'?'Monitor your cohort, assign mentors and keep support coordinated.':'Review student progress and leave guidance where it matters.'}</p></div><span class="date-pill">${mentees.length} mentees</span></div><div class="grid grid-3"><div class="stat"><div class="stat-top">Mentees <span class="stat-icon">◎</span></div><strong>${mentees.length}</strong><small>${me.role==='hod'?'Across the department':'Assigned to you'}</small></div><div class="stat"><div class="stat-top">Mentors <span class="stat-icon">↗</span></div><strong>${mentors.length||'—'}</strong><small>${me.role==='hod'?'Active mentors':'Managed by HOD'}</small></div><div class="stat"><div class="stat-top">Without mentor <span class="stat-icon">!</span></div><strong>${mentees.filter(x=>!x.mentor).length}</strong><small>Needs assignment</small></div></div><div class="card" style="margin-top:18px"><div class="card-header"><div><p class="eyebrow">Student directory</p><h2>Browse mentees</h2></div><input id="search" placeholder="Search students" style="border:1px solid var(--line);border-radius:8px;padding:9px 11px"></div><div class="grid grid-2"><div class="student-list" id="student-list">${studentButtons(mentees)}</div><div id="mentee-detail"><div class="empty">Select a student to view their profile, marks and mentor notes.</div></div></div></div>`}
function studentButtons(items){return items.length?items.map(m=>`<button data-mentee="${m.id}" aria-current="${selectedMentee===m.id}"><strong>${esc(m.name)}</strong><small>${esc(m.profile?.dept||'Department not added')} · ${total(m)===null?'No marks':total(m)+'% average'}</small></button>`).join(''):'<div class="empty">No mentees found.</div>'}
function renderManage(){return `<div class="hero"><div><p class="eyebrow">Department administration</p><h1>Mentors & assignment</h1><p>Create mentor accounts and connect them with students.</p></div></div><div class="grid grid-2"><div class="card"><div class="card-header"><div><p class="eyebrow">New mentor</p><h2>Add a mentor</h2></div></div><form id="mentor-form" class="form-grid">${['mentor-name','mentor-email','mentor-password'].map((id,i)=>`<div class="field"><label for="${id}">${['Full name','Email address','Temporary password'][i]}</label><input id="${id}" ${i===1?'type="email"':''} ${i===2?'type="password" minlength="8"':''} required></div>`).join('')}<div class="field full"><button class="btn gold">Create mentor account</button><span class="status" id="mentor-status"></span></div></form></div><div class="card"><div class="card-header"><div><p class="eyebrow">Current team</p><h2>${mentors.length} mentors</h2></div></div><div class="profile-preview">${mentors.map(m=>`<div class="profile-row"><span>${esc(m.name)}</span><strong>${esc(m.email)}</strong></div>`).join('')||'<div class="empty">No mentors created yet.</div>'}</div></div></div><div class="card" style="margin-top:18px"><div class="card-header"><div><p class="eyebrow">Assignment board</p><h2>Connect students to mentors</h2></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Student</th><th>Department</th><th>Mentor</th></tr></thead><tbody>${mentees.map(m=>`<tr><td><strong>${esc(m.name)}</strong></td><td>${esc(m.profile?.dept||'—')}</td><td><select data-assign="${m.id}"><option value="">Unassigned</option>${mentors.map(x=>`<option value="${x.id}" ${x.id===m.mentor?'selected':''}>${esc(x.name)}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="3">No mentees have signed up yet.</td></tr>'}</tbody></table></div></div>`}
document.addEventListener('click',async e=>{const student=e.target.closest('[data-student]');if(student){studentTab=student.dataset.student;renderApp();return}const button=e.target.closest('[data-mentee]');if(button){selectedMentee=button.dataset.mentee;await showMentee(button.dataset.mentee)}});
async function showMentee(id){const detail=$('#mentee-detail');if(!detail)return;try{const d=await api('/mentees/'+id),m=d.mentee,p=m.profile||{};detail.innerHTML=`<div class="card" style="padding:0;border:0;box-shadow:none"><div class="card-header"><div><p class="eyebrow">Student profile</p><h2>${esc(m.name)}</h2><p class="muted">${esc(m.email)}</p></div><span class="badge">${total(m)===null?'No marks':total(m)+'%'}</span></div><div class="profile-preview"><div class="profile-row"><span>Roll / department</span><strong>${esc(p.roll||'—')} · ${esc(p.dept||'—')}</strong></div><div class="profile-row"><span>Year</span><strong>${esc(p.year||'—')}</strong></div><div class="profile-row"><span>Hobbies</span><strong>${esc(p.hobbies||'—')}</strong></div><div class="profile-row"><span>Goals</span><strong>${esc(p.goals||'—')}</strong></div></div><h3 style="margin:22px 0 10px">Marks</h3>${p.marks?.length?p.marks.map(x=>`<div class="profile-row"><span>${esc(x.subject)}</span><strong>${x.got}/${x.max}</strong></div>`).join(''):'<div class="empty">No marks added yet.</div>'}${me.role==='mentor'?`<div style="border-top:1px solid var(--line);margin-top:20px;padding-top:20px"><h3>Leave guidance</h3><div class="field" style="margin-top:10px"><select id="note-kind"><option>Note</option><option>Recommendation</option></select></div><div class="field" style="margin-top:10px"><textarea id="note-text" placeholder="Write feedback or a recommendation..."></textarea></div><div class="actions"><button class="btn gold" id="save-note">Share with student</button><span class="status" id="note-status"></span></div></div>`:''}<h3 style="margin:22px 0 10px">Notes and recommendations</h3><div class="notes">${d.notes.length?d.notes.map(noteHtml).join(''):'<div class="empty">No guidance shared yet.</div>'}</div></div>`;if(me.role==='mentor')$('#save-note').onclick=async()=>{try{await api('/mentees/'+id+'/notes','POST',{kind:$('#note-kind').value,text:$('#note-text').value});await showMentee(id)}catch(e){$('#note-status').textContent=e.message}}}catch(e){detail.innerHTML=`<p class="error">${esc(e.message)}</p>`}}
document.addEventListener('input',e=>{if(e.target.id==='search'){const q=e.target.value.toLowerCase();const list=$('#student-list');if(list)list.innerHTML=studentButtons(mentees.filter(m=>m.name.toLowerCase().includes(q)))}});document.addEventListener('change',async e=>{if(e.target.dataset.assign){try{await api('/mentees/'+e.target.dataset.assign+'/mentor','PUT',{mentor:e.target.value||null});mentees=await api('/mentees');renderApp()}catch(err){alert(err.message)}}});
document.addEventListener('submit',async e=>{if(e.target.id==='mentor-form'){e.preventDefault();try{const d=await api('/mentors','POST',{name:$('#mentor-name').value,email:$('#mentor-email').value,password:$('#mentor-password').value});mentors.push(d);renderApp()}catch(err){$('#mentor-status').textContent=err.message}}});
async function saveProfile(section){const p=me.profile||{},v=id=>$('#'+id)?.value||'',marks=section==='academic'?[...document.querySelectorAll('.mark-row')].map(row=>{const i=row.querySelectorAll('input');return{subject:i[0].value,got:i[1].value,max:i[2].value}}):(p.marks||[]),body={name:section==='personal'?v('name'):me.name,contact:section==='personal'?v('contact'):p.contact,hobbies:section==='personal'?v('hobbies'):p.hobbies,goals:section==='personal'?v('goals'):p.goals,about:section==='personal'?v('about'):p.about,roll:section==='academic'?v('roll'):p.roll,dept:section==='academic'?v('dept'):p.dept,year:section==='academic'?v('year'):p.year,marks};try{const d=await api('/me/profile','PUT',body);me.name=d.user.name;me.profile=d.user.profile;$('#'+section+'-status').textContent='Saved successfully.'}catch(e){$('#'+section+'-status').textContent=e.message}}
document.addEventListener('click',e=>{if(e.target.id==='save-personal')saveProfile('personal');if(e.target.id==='save-academic')saveProfile('academic');if(e.target.id==='add-mark')$('#marks').insertAdjacentHTML('beforeend',markRow({max:100}));if(e.target.classList.contains('remove'))e.target.closest('.mark-row').remove()});
start();
</script>
</body>
</html>
